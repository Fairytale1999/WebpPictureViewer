<!DOCTYPE html>
<html>
<head>
    <title>WebpPictureViewer</title>
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script>
       var arry = [
            // 格式固定，中文位置需要改，fileSuffix默认.webp如果是gif或者png等别的图片就改成对应的
            {"name": "文件名", "path": "文件夹位置/", "fileSum": 图片数量, "fileSuffix": ".webp"},
        ];
       // mp3文件
       var audioSrc="";
    </script>
    <style>
        @font-face {
            font-family: "MyRegularFont"; 
            <!--这里是字体文件配置，无需求可以不用管，自己有ttf字体文件的话可以改成你的文件位置-->
            src: url(".GurationFiles/mplus-1m-regular.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family:"MyRegularFont",sans-serif;
        }
        html, body {
            background-color: #000000;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        #scrollContainer {
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            background-color: #000000;
        }
        .content {
            display: flex;
            flex-direction: column;
            padding: 0;
        }
        .image-item {
            width: 100%;
            display: flex;
            flex-direction: column;
            background-color: #000000;
            line-height: 0;
            font-size: 0;
        }
        .image-item img {
            width: 100%;
            height: auto;
            display: block;
            background-color: #000000;
            margin: 0;
            padding: 0;
            border: none;
        }
        .page-indicator {
            position: fixed;
            bottom: 30px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 6px 13px;
            border-radius: 30px;
            font-size: 10px;
            z-index: 1000;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            pointer-events: auto;
            cursor: pointer;
        }
        .page-indicator:active {
            background: rgba(255,255,255,0.15);
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px 30px;
            border-radius: 40px;
            font-size: 16px;
            z-index: 2000;
            display: none;
            backdrop-filter: blur(5px);
        }
        .loading.active {
            display: block;
        }
        .menu-btn {
            position: fixed;
            top: 15px;
            right: 0;
            width: 30px;
            height: 30px;
            background: rgba(0,0,0,0.5);
            border: none;
            border-radius: 20px 0 0 20px;
            color: white;
            font-size: 15px;
            cursor: pointer;
            z-index: 1500;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            border-left: 1px solid rgba(255,255,255,0.2);
            transition: right 0.3s ease;
        }
        .menu-btn.slide-out {
            right: 300px;
        }
        .drawer {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100%;
            background: rgba(20,20,20,0.98);
            backdrop-filter: blur(10px);
            transition: right 0.3s ease;
            z-index: 2000;
            overflow-y: auto;
            padding: 20px 10px;
            border-left: 1px solid rgba(255,255,255,0.1);
        }
        .drawer.open {
            right: 0;
        }
        .drawer-item {
            display: flex;
            flex-direction: column;
            padding: 8px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.05);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
            cursor: pointer;
        }
        .drawer-item:active {
            background: rgba(255,255,255,0.15);
            transform: scale(0.98);
        }
        .drawer-item.active {
            background: #12a9ba;
            border-color: transparent;
        }
        .preview-container {
            width: 100%;
            height: 66px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 5px;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .preview-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .preview-placeholder {
            width: 100%;
            height: 100%;
            background: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 12px;
        }
        .drawer-item .title {
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            word-break: break-word;
            line-height: 1.3;
        }
        .drawer-item .count {
            font-size: 10px;
            color: rgba(255,255,255,0.7);
            text-align: center;
            margin-top: 3px;
        }
        .back-top {
            position: fixed;
            bottom: 70px;
            right: 20px;
            width: 35px;
            height: 35px;
            background: rgba(0,0,0,0.5);
            border: none;
            border-radius: 18px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: none;
            z-index: 1500;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            transition: opacity 0.2s;
        }
        .error-badge {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 68, 68, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 8px;
            z-index: 10;
            backdrop-filter: blur(5px);
            pointer-events: none;
        }
        .debug-info {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            color: #0f0;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 3000;
            display: none;
        }
        .drawer::-webkit-scrollbar {
            width: 3px;
        }
        .drawer::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 1.5px;
        }
        .page-mask {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(2px);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .page-mask.show {
            display: flex;
        }
        .page-modal {
            background: rgba(20,20,20,0.95);
            border:1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding:20px;
            min-width:260px;
        }
        .page-modal-title {
            color:#fff;
            font-size:15px;
            margin-bottom:14px;
            text-align:center;
        }
        .page-input-wrap {
            display:flex;
            align-items:center;
            justify-content:center;
            gap:6px;
            margin-bottom:18px;
        }
        .page-jump-input {
            width: 80px;
            text-align:center;
            background:rgba(255,255,255,0.1);
            border:1px solid rgba(255,255,255,0.25);
            border-radius:12px;
            color:#fff;
            padding:6px 0;
            font-size:14px;
            outline:none;
        }
        .page-total-text {
            color:#ccc;
            font-size:14px;
        }
        .page-btn-group {
            display:flex;
            gap:10px;
            justify-content:center;
        }
        .page-btn-group button {
            padding:7px 18px;
            border-radius:10px;
            border:none;
            font-size:14px;
            cursor:pointer;
        }
        .btn-cancel {
            background:rgba(255,255,255,0.1);
            color:#fff;
            border:1px solid rgba(255,255,255,0.2);
        }
        .btn-go {
            background:#12a9ba;
            color:#fff;
        }
        .page-jump-input::-webkit-outer-spin-button,
        .page-jump-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        
        .audio-hidden{
            opacity: 0.5;
        }
        /* 底部浮动进度条 */
        .audio-progress-wrap{
            position:fixed;
            bottom:20px;
            left: 5%;
            width:50%;
            height:6px;
            background-color: #555;
            border-radius: 5px;
        }
        .audio-progress{
            height: 100%;
            width: 0%;
            background-color: red;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="scrollContainer">
        <div class="page-indicator" id="pageIndicator">0/0</div>
        <div class="page-mask" id="pageMask">
            <div class="page-modal">
                <div class="page-modal-title">跳转到指定页码</div>
                <div class="page-input-wrap">
                    <input class="page-jump-input" id="jumpInput" type="number" min="1" value="1">
                    <span class="page-total-text">/ <span id="modalTotal">0</span></span>
                </div>
                <div class="page-btn-group">
                    <button class="btn-cancel" id="cancelJump">取消</button>
                    <button class="btn-go" id="confirmJump">跳转</button>
                </div>
            </div>
        </div>
        <button class="menu-btn" id="menuBtn">☰</button>
        <div class="drawer" id="drawer"></div>
        <button class="back-top" id="backTop">↑</button>
        <div class="loading" id="loading">加载中...</div>
        <div class="debug-info" id="debugInfo"></div>
        <div class="audio-hidden">
            <div>
                <audio id="audio" src="" style="display: none;" controls loop>
            </div>
            <!-- 进度条 -->
            <div class="audio-progress-wrap" id="progressWrap">
                <div class="audio-progress" id="progressBar"></div>
            </div>
        </div>
        <div class="content" id="content"></div>
    </div>

    <script>
        /**
        * @author 爱睡觉de大懒虫
        * @date 2026-07-02
        * 
        * 增加背景音乐以及播放条(点击任意位置播放)
        * 点击页码可跳转位置
        * 浏览记录→LocalStorage
        * 删除文件后页面打不开/已修复
        * 
        * 
        */
        const pageSize = 10;
        let currentCollection = -1;
        let currentIndex = 1;
        let isLoading = false;
        let loadedImages = 0;
        let totalImages = 0;
        let currentViewIndex = 1;
        const previewCache = {};
        let saveScrollTimer = null;
        const container = document.getElementById('scrollContainer');
        let isJumping = false;
        let isSaving = false;
        let collWaitTimer = null;
        let collTimeoutTimer = null;
        let autoScrollLock = false;
        let restoreTargetScroll = null;
        let isAutoJump = false;  // 是否开启自动跳转(true开启，false关闭)
        let audioinit = true;   //是否开启背景音乐播放(true开启，false关闭)
        
        const resizeObs = new ResizeObserver(() => {
            if (isJumping && restoreTargetScroll !== null) {
                autoScrollLock = true;
                container.scrollTop = restoreTargetScroll;
                setTimeout(() => autoScrollLock = false, 50);
            }
        });
        resizeObs.observe(container);
        
        function getAllProgress() {
            const raw = localStorage.getItem('webpToolProgress');
            if (!raw) return {};
            try {
                return JSON.parse(raw);
            } catch (err) {
                localStorage.removeItem('webpToolProgress');
                return {};
            }
        }
        
        function saveCurrentProgressNow() {
            if (isJumping || isSaving) return;
            isSaving = true;
            const progress = getAllProgress();
            const key = `coll_${currentCollection}`;
            progress[key] = {
                collIndex: currentCollection,
                viewPage: currentViewIndex,
                scrollTop: container.scrollTop
            };
            localStorage.setItem('webpToolProgress', JSON.stringify(progress));
            setTimeout(() => isSaving = false, 100);
        }
        
        function debounceSaveProgress() {
            if (isJumping) return;
            clearTimeout(saveScrollTimer);
            saveScrollTimer = setTimeout(saveCurrentProgressNow, 400);
        }
        
        function getCollProgress(collIdx) {
            return getAllProgress()[`coll_${collIdx}`] || null;
        }
        
        function refreshSidebarActive() {
            const items = document.querySelectorAll('.drawer-item');
            items.forEach((item, idx) => {
                item.classList.toggle('active', idx === currentCollection);
            });
        }
        
        window.addEventListener('blur', () => {
            if (!isJumping) saveCurrentProgressNow();
        });
        initDrawer();
        initPageModal();
        let lastColl = Number(localStorage.getItem('webpToolLastColl')) || 0;
        if (lastColl >= arry.length){
            lastColl = 0;
        }
        loadCollection(lastColl);
        
        function loadCollection(index) {
            clearInterval(collWaitTimer);
            clearTimeout(collTimeoutTimer);
            restoreTargetScroll = null;
            saveCurrentProgressNow();
            currentCollection = index;
            localStorage.setItem('webpToolLastColl', index);
            refreshSidebarActive();
        
            currentIndex = 1;
            loadedImages = 0;
            totalImages = arry[index].fileSum;
            document.getElementById('content').innerHTML = '';
            document.getElementById('modalTotal').textContent = totalImages;
            document.getElementById('jumpInput').value = 1;
            currentViewIndex = 1;
            container.scrollTop = 0;
            updateIndicator();
            loadMore();
            const record = getCollProgress(index);
            if (!record || !isAutoJump) return;
            
            collTimeoutTimer = setTimeout(() => {
                clearInterval(collWaitTimer);
                jumpDirect(record.viewPage, record.scrollTop);
            }, 2000);
        
            collWaitTimer = setInterval(() => {
                const loadedEnough = currentIndex > record.viewPage;
                const targetDom = document.querySelector(`.image-item[data-index="${record.viewPage}"]`);
                if (loadedEnough && targetDom) {
                    clearInterval(collWaitTimer);
                    clearTimeout(collTimeoutTimer);
                    jumpDirect(record.viewPage, record.scrollTop);
                }
            }, 60);
        }
        
        function getImagePath(collIdx, imgIdx) {
            return `${arry[collIdx].path}${imgIdx}${arry[collIdx].fileSuffix}`;
        }
        
        function createImageItem(idx) {
            const item = document.createElement('div');
            item.className = 'image-item';
            item.dataset.index = idx;
            const img = document.createElement('img');
            img.style.opacity = '0';
            img.style.transition = 'opacity 0.3s';
        
            img.onload = () => {
                img.style.opacity = '1';
                loadedImages++;
                if (!isJumping) updateIndicator();
                item.querySelector('.error-badge')?.remove();
            };
            img.onerror = () => {
                if (!item.querySelector('.error-badge')) {
                    const err = document.createElement('span');
                    err.className = 'error-badge';
                    err.textContent = '❌ 加载失败';
                    item.appendChild(err);
                }
                setTimeout(() => {
                    const src = img.src;
                    img.src = '';
                    setTimeout(() => img.src = src, 500);
                }, 2000);
            };
            img.src = getImagePath(currentCollection, idx);
            item.appendChild(img);
            return item;
        }
        
        function loadMore() {
            if (isLoading) return;
            const max = arry[currentCollection].fileSum;
            if (currentIndex > max) {
                document.getElementById('loading').classList.remove('active');
                return;
            }
            isLoading = true;
            document.getElementById('loading').classList.add('active');
            requestAnimationFrame(() => {
                setTimeout(() => {
                    const wrap = document.getElementById('content');
                    const batch = Math.min(pageSize, max - currentIndex + 1);
                    for (let i = 0; i < batch; i++) {
                        wrap.appendChild(createImageItem(currentIndex));
                        currentIndex++;
                    }
                    isLoading = false;
                    document.getElementById('loading').classList.remove('active');
                    if (!isJumping && currentIndex <= max && isNearBottom()) loadMore();
                }, 50);
            });
        }
        
        function jumpDirect(targetPage, targetScroll = null) {
            isJumping = true;
            restoreTargetScroll = targetScroll;
            const maxPage = arry[currentCollection].fileSum;
            targetPage = Math.max(1, Math.min(targetPage, maxPage));
            document.getElementById('jumpInput').value = targetPage;
        
            function loadStep() {
                if (currentIndex <= targetPage && !isLoading) {
                    loadMore();
                    setTimeout(loadStep, 80);
                } else {
                    setTimeout(() => {
                        const targetDom = document.querySelector(`.image-item[data-index="${targetPage}"]`);
                        if (targetDom) container.scrollTop = targetDom.offsetTop;
        
                        if (targetScroll !== null) {
                            let retryCount = 0;
                            const maxRetry = 12;
                            function lockScroll() {
                                container.scrollTop = targetScroll;
                                retryCount++;
                                if (retryCount >= maxRetry) {
                                    // 直接释放锁，无无效clearInterval
                                    updateIndicator();
                                    isJumping = false;
                                    restoreTargetScroll = null;
                                    return;
                                }
                                setTimeout(lockScroll, 100);
                            }
                            lockScroll();
                        } else {
                            updateIndicator();
                            isJumping = false;
                            restoreTargetScroll = null;
                        }
                    }, 120);
                }
            }
            loadStep();
        }
        
        function goToPage(targetNum) {
            const total = arry[currentCollection].fileSum;
            targetNum = Math.max(1, Math.min(targetNum, total));
            closePageModal();
            jumpDirect(targetNum);
        }
        
        function initPageModal() {
            const mask = document.getElementById('pageMask');
            const indicator = document.getElementById('pageIndicator');
            const jumpInput = document.getElementById('jumpInput');
            const confirmBtn = document.getElementById('confirmJump');
            const cancelBtn = document.getElementById('cancelJump');
        
            indicator.onclick = () => {
                mask.classList.add('show');
                jumpInput.value = currentViewIndex;
                jumpInput.focus();
            };
            cancelBtn.onclick = closePageModal;
            mask.onclick = e => e.target === mask && closePageModal();
            confirmBtn.onclick = () => {
                const n = Number(jumpInput.value);
                if (!isNaN(n)) goToPage(n);
            };
            jumpInput.onkeydown = e => {
                if (e.key === 'Enter') goToPage(Number(jumpInput.value));
            };
        }
        function closePageModal() {
            document.getElementById('pageMask').classList.remove('show');
        }
        
        function isNearBottom() {
            return container.scrollHeight - container.scrollTop - container.clientHeight < 600;
        }
        
        function updateIndicator() {
            const indicator = document.getElementById('pageIndicator');
            const items = document.querySelectorAll('.image-item');
            if (items.length === 0) return;
            const viewMid = container.scrollTop + container.clientHeight / 2;
            let bestIdx = 1;
            let minDis = Infinity;
            items.forEach(el => {
                const idx = Number(el.dataset.index);
                const mid = el.offsetTop + el.offsetHeight / 2;
                const dis = Math.abs(mid - viewMid);
                if (dis < minDis) {
                    minDis = dis;
                    bestIdx = idx;
                }
            });
            currentViewIndex = Math.max(1, Math.min(bestIdx, totalImages));
            indicator.textContent = `${currentViewIndex}/${totalImages}`;
            debounceSaveProgress();
        }
        
        function loadPreviewImage(box, collIdx) {
            const img = document.createElement('img');
            const src = getImagePath(collIdx, 1);
            img.onload = () => {
                box.innerHTML = '';
                box.appendChild(img);
                previewCache[collIdx] = src;
            };
            img.onerror = () => {
                const placeholder = document.createElement('div');
                placeholder.className = 'preview-placeholder';
                placeholder.textContent = '无预览';
                box.innerHTML = '';
                box.appendChild(placeholder);
            };
            img.src = src;
        }
        
        function initDrawer() {
            const drawer = document.getElementById('drawer');
            arry.forEach((itemData, idx) => {
                const item = document.createElement('div');
                item.className = `drawer-item${idx === currentCollection ? ' active' : ''}`;
                const preBox = document.createElement('div');
                preBox.className = 'preview-container';
                preBox.innerHTML = '<div class="preview-placeholder">加载中...</div>';
                const title = document.createElement('div');
                title.className = 'title';
                title.textContent = itemData.name;
                const count = document.createElement('div');
                count.className = 'count';
                count.textContent = `共 ${itemData.fileSum} 张`;
                item.append(preBox, title, count);
                item.onclick = e => {
                    e.preventDefault();
                    document.querySelectorAll('.drawer-item').forEach(d => d.classList.remove('active'));
                    item.classList.add('active');
                    loadCollection(idx);
                    drawer.classList.remove('open');
                    document.getElementById('menuBtn').classList.remove('slide-out');
                };
                drawer.appendChild(item);
                loadPreviewImage(preBox, idx);
            });
        }
        
        container.addEventListener('scroll', () => {
            if (autoScrollLock) return;
            updateIndicator();
            if (!isJumping && isNearBottom()) loadMore();
            document.getElementById('backTop').style.display = container.scrollTop > 500 ? 'block' : 'none';
        });
        
        document.getElementById('backTop').onclick = () => {
            container.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => {
                updateIndicator();
                saveCurrentProgressNow();
            }, 350);
        };
        
        const menuBtn = document.getElementById('menuBtn');
        const drawer = document.getElementById('drawer');
        menuBtn.onclick = () => {
            drawer.classList.toggle('open');
            menuBtn.classList.toggle('slide-out');
        };
        document.addEventListener('click', e => {
            if (!drawer.contains(e.target) && !menuBtn.contains(e.target)) {
                drawer.classList.remove('open');
                menuBtn.classList.remove('slide-out');
            }
        });
        
        setInterval(() => {
            if (!isJumping && isNearBottom() && !isLoading) loadMore();
            if (!isJumping) updateIndicator();
        }, 300);
        
        window.addEventListener('resize', () => setTimeout(updateIndicator, 100));
        
        // 背景音乐
        const audio = document.querySelector('#audio');
        const progressWrap = document.getElementById('progressWrap');
        const progressBar = document.getElementById('progressBar');
        
        // 控件、播放器初始化
        if( !(audioSrc!="" && audioSrc.length>0) || !audioinit ){
            progressWrap.style.display = "none";
        } else {
            audio.src = audioSrc;
        }
        document.addEventListener('click', function playAudio() {
            if(!audioinit) return;
            audioinit = false;
            audio.play();
            document.removeEventListener('click', playAudio);
        })
        
        // 更新进度条
        audio.ontimeupdate = ()=>{
            if(audio.duration){
                let pct = (audio.currentTime / audio.duration) * 100;
                console.log(pct)
                progressBar.style.width = pct + '%';
            }
        };
        
        // 点击进度跳转
        progressWrap.onclick = e=>{
            if(!audio.duration) return;
            let rect = progressWrap.getBoundingClientRect();
            let rate = (e.clientX - rect.left) / rect.width;
            audio.currentTime = audio.duration * rate;
        };
    </script>
</body>
</html>
